const defaults=[
{id:'ISL-001',title:'File tray does not expand horizontally',module:'File Tray',type:'UI issue',priority:'High',status:'In progress',summary:'The file tray expands vertically from the bottom but does not gain enough horizontal space. Contents become compressed, misaligned, and difficult to use.',target:'The file tray should intelligently expand horizontally and vertically to accommodate file cards while remaining anchored to the island and respecting safe screen bounds.',questions:'What are the correct minimum and maximum tray widths? How should multiple displays and differing menu-bar spaces affect geometry?',decisions:'Prefer content-driven width with bounded dimensions; validate against screenshots before finalizing.',tasks:'Reproduce at multiple display scales\nMeasure item intrinsic widths and parent constraints\nImplement width-aware layout and transitions\nAdd screenshot regression tests',tests:'Single and multiple files\nSmall and large Mac displays\nDifferent macOS scaling options\nKeyboard navigation and VoiceOver',notes:'Known issue from previous UI review. Confirm latest behavior against current build.',current:'',targetImage:''},
{id:'ISL-002',title:'MCP Connections scroll region is too short',module:'MCP Connections',type:'UI issue',priority:'High',status:'In progress',summary:'The MCP Connections scrollable view stops above the available lower boundary and clips or constrains content prematurely.',target:'The scroll region should extend toward the bottom of the available panel, accommodate expanded connection entries, and preserve sensible safe-area padding.',questions:'Should the whole panel scroll or only the connection list? How much bottom inset is required?',decisions:'Prefer a single clear scrolling container with measured available height.',tasks:'Audit nested scroll containers\nRemove unintended fixed-height constraints\nVerify expansion and bottom insets\nTest trackpad and keyboard scrolling',tests:'Long connection list\nExpanded connection details\nDynamic type and window resizing\nBottom item fully reachable',notes:'Known issue from earlier screenshot review.',current:'',targetImage:''},
{id:'ISL-003',title:'Notification previews and Focus status unavailable',module:'Notifications',type:'UI issue',priority:'High',status:'Research',summary:'The notifications surface reports that Focus status is unavailable and notification previews remain hidden. The root cause and applicable macOS permissions are not yet verified.',target:'Show accurately available notification information with clear permission states and documented privacy behavior; do not promise private content unavailable through public APIs.',questions:'Which macOS APIs legitimately expose Focus/notification state to third-party apps? What capabilities are app-private or entitlement-gated?',decisions:'No unsupported API or privacy bypass. Investigate legitimate OS capabilities first.',tasks:'Map observed system behavior\nReview Apple notification and Focus documentation\nDocument authorization and entitlement constraints\nDesign fallback permission messaging',tests:'Permission granted/denied\nFocus enabled/disabled\nLock-screen privacy settings\nDifferent supported macOS versions',notes:'Research inspiration: Adams1of1 Droppy; do not assume identical behavior is possible without verification.',current:'',targetImage:''},
{id:'ISL-004',title:'Agents Chat interaction and presentation',module:'Agents Chat',type:'Feature module',priority:'Medium',status:'Planned',summary:'Define the agents chat surface, interaction states, and integration boundaries for an island-sized macOS experience.',target:'A responsive, keyboard-friendly chat panel with clear loading, error, and empty states plus readable conversation hierarchy.',questions:'Which agents are supported? Should conversation history be local or synchronized?',decisions:'Keep chat content readable and system-like; defer external integrations until contracts are defined.',tasks:'Define interaction map\nBuild component states\nImplement accessibility labels\nDocument integration API',tests:'Empty and long messages\nKeyboard focus\nNetwork failure UI\nPrivacy of conversation content',notes:'Module tracked; implementation state requires repository verification.',current:'',targetImage:''},
{id:'ISL-005',title:'Teleprompter controls and reading flow',module:'Teleprompter',type:'Feature module',priority:'Medium',status:'Planned',summary:'Capture the planned teleprompter surface and acceptance criteria.',target:'Distraction-free reading controls, adjustable speed and type size, smooth progression, and clear start/pause state.',questions:'Should scripts sync across devices? Is always-on-top behavior required?',decisions:'Support reduced motion and clear playback controls.',tasks:'Prototype reading layout\nDefine speed and typography controls\nAdd keyboard shortcuts\nValidate overflow behavior',tests:'Long scripts\nPause and resume\nReduced motion\nDisplay scaling',notes:'Planning placeholder, not a verified defect.',current:'',targetImage:''},
{id:'ISL-006',title:'Window Snap usability and bounds',module:'Window Snap',type:'Feature module',priority:'Medium',status:'Planned',summary:'Specify window snapping interaction patterns, OS permission requirements, and edge cases.',target:'Predictable snapping previews, unambiguous hit areas, and safe transitions respecting current display geometry.',questions:'How does the app interact with macOS native tiling? What accessibility permissions are needed?',decisions:'Respect system window management conventions and permissions.',tasks:'Map native window management interactions\nPrototype snap previews\nDocument permission flow\nTest multi-monitor geometry',tests:'Multiple displays\nFull-screen windows\nStage Manager\nPermission denied',notes:'Planning placeholder pending source-code inspection.',current:'',targetImage:''},
{id:'ISL-007',title:'Keep Awake state and feedback',module:'Keep Awake',type:'Feature module',priority:'Low',status:'Planned',summary:'Track controls for preventing sleep with explicit scope and visible session state.',target:'A reliable on/off state, optional timeout, and clear indication of what sleep behavior is affected.',questions:'Should the setting survive restarts? What is the exact power assertion scope?',decisions:'Avoid hidden perpetual assertions; keep user control explicit.',tasks:'Define lifecycle\nImplement visible state\nHandle timeout and cleanup\nReview power assertion guidance',tests:'Manual toggle\nSleep/wake cycle\nApp termination cleanup\nBattery mode',notes:'Planning placeholder.',current:'',targetImage:''},
{id:'ISL-008',title:'Shortcuts discovery and execution',module:'Shortcuts',type:'Feature module',priority:'Low',status:'Planned',summary:'Design a shortcut launcher that stays fast and accessible at compact sizes.',target:'Searchable shortcut list, reliable execution feedback, and informative error states.',questions:'How are shortcuts enumerated and authorized? Are there sandbox limitations?',decisions:'Expose only accessible actions and keep errors actionable.',tasks:'Inventory available actions\nDesign list and search\nImplement run states\nTest unavailable actions',tests:'Search matching\nKeyboard activation\nFailed execution\nPermission handling',notes:'Planning placeholder.',current:'',targetImage:''}
];
const modules=[['File Tray','▣'],['MCP Connections','⬡'],['Notifications','◌'],['Agents Chat','✧'],['Teleprompter','▤'],['Window Snap','▦'],['Keep Awake','☼'],['Shortcuts','⌘']];
const references=[{title:'Apple Human Interface Guidelines',desc:'Mac-native principles, hierarchy, layout, materials, typography and accessibility.',url:'https://developer.apple.com/design/human-interface-guidelines/'},{title:'Sidebars and split-view patterns',desc:'Navigation structures and sidebar behavior for macOS.',url:'https://developer.apple.com/design/human-interface-guidelines/sidebars'},{title:'Lists and tables',desc:'Scannable issue registers, selection feedback, and detail navigation.',url:'https://developer.apple.com/design/human-interface-guidelines/lists-and-tables'},{title:'Apple Developer Documentation',desc:'Verify framework, permissions, notifications, window management and system constraints.',url:'https://developer.apple.com/documentation/'},{title:'GitHub Pages documentation',desc:'Publish a static project site directly from your repository.',url:'https://docs.github.com/en/pages'}];
const defaultChecks=[{name:'All P0/P1 defects resolved or explicitly waived',done:false},{name:'Screenshot before/after evidence attached',done:false},{name:'Keyboard and accessibility pass complete',done:false},{name:'macOS scaling / multi-display checks complete',done:false},{name:'Permission and privacy behavior reviewed',done:false},{name:'Thesis documentation and supervisor review prepared',done:false},{name:'Build, signing, notarization and distribution verified',done:false}];
let data;try{data=JSON.parse(localStorage.getItem('island-studio-v1'))}catch{}if(!data||!Array.isArray(data.issues))data={issues:structuredClone(defaults),checks:structuredClone(defaultChecks),notes:'Research protocol:\n1. Reproduce the behavior and capture screenshots.\n2. Consult Apple HIG and official API documentation.\n3. Separate confirmed capabilities from speculative behavior.\n4. Record implementation evidence and testing results.\n5. Re-review against the original screenshot before closing.',updated:new Date().toISOString()};
let publicHistory={schemaVersion:1,milestones:[],generatedAt:null};let milestoneFilter='All',milestoneQuery='';let page='Overview',selectedId=null,filter='All',moduleFilter='',query='',editing=false;const $=s=>document.querySelector(s);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const save=()=>{data.updated=new Date().toISOString();try{localStorage.setItem('island-studio-v1',JSON.stringify(data))}catch{alert('Local storage is full. Export a backup and remove large image attachments.')}$('#lastUpdated').textContent=new Date(data.updated).toLocaleDateString()};const showToast=s=>{const t=$('#toast');t.textContent=s;t.classList.remove('hidden');clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>t.classList.add('hidden'),2400)};
const statusClass=s=>({'In progress':'progress','Planned':'todo','Blocked':'blocked','Research':'review','Review':'review','Done':'done'}[s]||'todo');const priorityClass=s=>({'High':'high','Medium':'medium','Low':'low'}[s]||'low');const pill=(v,type)=>`<span class="pill ${type==='priority'?priorityClass(v):statusClass(v)}">${esc(v)}</span>`;const issuesFor=m=>data.issues.filter(x=>!m||x.module===m);const progress=arr=>arr.length?Math.round(arr.filter(x=>x.status==='Done').length/arr.length*100):0;
function nav(){const items=[['Overview','▦'],['UI Issues','⊞'],['Feature Modules','◈'],['Research','⌕'],['Milestones','◷'],['Implementation','☷'],['Testing','✓'],['Release Readiness','◉']];$('#nav').innerHTML=items.map(([name,icon])=>`<button class="nav-btn ${page===name?'active':''}" data-nav="${name}"><span class="ico">${icon}</span>${name}<span class="count">${name==='UI Issues'?data.issues.filter(x=>x.type==='UI issue').length:name==='Implementation'?data.issues.length:''}</span></button>`).join('');$('#crumb').textContent=selectedId?'Issue details':page;$('#lastUpdated').textContent=new Date(data.updated).toLocaleDateString()}
const heading=(label,title,sub)=>`<div class="heading-row"><div><div class="eyebrow">${label}</div><h1>${title}</h1><p class="subtitle">${sub}</p></div><span class="heading-note">macOS project · v0.1 workspace</span></div>`;
function table(items){return `<div class="table-wrap"><table><thead><tr><th>Issue / Task</th><th>Module</th><th>Priority</th><th>Status</th></tr></thead><tbody>${items.length?items.map(x=>`<tr data-issue="${esc(x.id)}"><td><span class="issue-title">${esc(x.title)}</span><span class="issue-id">${esc(x.id)} · ${esc(x.type)}</span></td><td>${esc(x.module)}</td><td>${pill(x.priority,'priority')}</td><td>${pill(x.status)}</td></tr>`).join(''):`<tr><td colspan="4" class="empty">No matching issues. Try another filter.</td></tr>`}</tbody></table></div>`}
function moduleCards(){return `<div class="modules">${modules.map(([name,icon])=>{const x=issuesFor(name);return `<button class="module-card" data-module="${esc(name)}"><span class="module-icon">${icon}</span><strong>${esc(name)}</strong><small>${x.length} tracked item${x.length===1?'':'s'} · ${progress(x)}% done</small></button>`}).join('')}</div>`}
function overview(){const total=data.issues.length,done=data.issues.filter(x=>x.status==='Done').length,open=data.issues.filter(x=>x.status!=='Done').length,high=data.issues.filter(x=>x.priority==='High'&&x.status!=='Done').length;return heading('PROJECT CONTROL CENTER','A clearer path to ship.','Track design quality, implementation progress and thesis evidence in one place.')+`<div class="stats"><div class="stat"><div class="stat-top">Tracked work <span class="mini-icon">▤</span></div><div class="stat-value">${total}</div><div class="stat-foot">Across 8 modules</div></div><div class="stat"><div class="stat-top">Active / open <span class="mini-icon">◴</span></div><div class="stat-value">${open}</div><div class="stat-foot">Awaiting completion</div></div><div class="stat"><div class="stat-top">High priority <span class="mini-icon">◇</span></div><div class="stat-value">${high}</div><div class="stat-foot">Requires focused attention</div></div><div class="stat"><div class="stat-top">Completed <span class="mini-icon">✓</span></div><div class="stat-value">${done}</div><div class="stat-foot">${progress(data.issues)}% of tracked work</div></div></div><div class="layout-2"><div><section class="panel"><div class="panel-head"><div><h2>Priority queue</h2><p>The most important unresolved work</p></div><button class="small-link" data-nav="Implementation">View all →</button></div>${table([...data.issues].filter(x=>x.status!=='Done').sort((a,b)=>({High:0,Medium:1,Low:2}[a.priority]-{High:0,Medium:1,Low:2}[b.priority])).slice(0,5))}</section></div><div><section class="panel"><div class="panel-head"><div><h2>Project health</h2><p>Snapshot of delivery progress</p></div></div><div style="padding:0 21px 18px"><div class="progress-row"><span>Implementation coverage</span><b>${progress(data.issues)}%</b></div><div class="progress-track"><div class="progress-fill" style="width:${progress(data.issues)}%"></div></div><div class="progress-row"><span>Release checks</span><b>${data.checks.filter(x=>x.done).length}/${data.checks.length}</b></div><div class="progress-track"><div class="progress-fill" style="width:${Math.round(data.checks.filter(x=>x.done).length/data.checks.length*100)}%"></div></div><div class="note" style="margin-top:20px">◉ &nbsp; The tracker starts with known observations and planning placeholders. Issue completion is not inferred from repository activity.</div></div></section></div></div><div class="section-head"><h2>Feature modules</h2><button class="small-link" data-nav="Feature Modules">Explore modules →</button></div>${moduleCards()}<div class="layout-2"><div class="panel"><div class="panel-head"><div><h2>Suggested execution order</h2><p>From visible UI regressions to shipping confidence</p></div></div>${[['Stabilize geometry','File Tray and MCP scroll-area fixes'],['Validate system integrations','Notifications and Focus APIs; permission boundaries'],['Refine feature surfaces','Agents Chat, Teleprompter, Window Snap, Keep Awake, Shortcuts'],['Prove release quality','Accessibility, regression evidence, supervisor review']].map(([a,b],i)=>`<div class="roadmap-step"><span class="step-num">0${i+1}</span><div><strong>${a}</strong><p>${b}</p></div></div>`).join('')}</div><div class="panel"><div class="panel-head"><div><h2>Supervisor-ready evidence</h2><p>Make each engineering decision traceable</p></div></div><div style="padding:0 20px 20px"><p style="font-size:12px;color:#838b97;line-height:1.8">Each issue can hold screenshots, expected behavior, open questions, decisions, a reproducible task checklist and verification criteria.</p><button class="button" data-nav="Release Readiness">Review release criteria →</button></div></div></div>`}
function listPage(kind){const isIssues=kind==='UI Issues';const items=data.issues.filter(x=>(!isIssues||x.type==='UI issue')&&(!moduleFilter||x.module===moduleFilter)&&(!query||[x.title,x.summary,x.module,x.id].join(' ').toLowerCase().includes(query.toLowerCase()))&&(filter==='All'||x.status===filter));return heading('ISSUE REGISTER',isIssues?'UI issues':'Implementation backlog',isIssues?'Known visual and behavioral defects, with target-state evidence.':'Prioritize, document and close work with explicit acceptance criteria.')+`<div class="filter-bar">${['All','In progress','Research','Planned','Review','Blocked','Done'].map(s=>`<button class="filter ${filter===s?'selected':''}" data-filter="${s}">${s}</button>`).join('')}${moduleFilter?`<button class="filter selected" data-clear-module="1">${esc(moduleFilter)} ×</button>`:''}</div><section class="panel"><div class="panel-head"><div><h2>${items.length} matching item${items.length===1?'':'s'}</h2><p>Choose a row to open its detail view and edit its fields.</p></div></div>${table(items)}</section>`}
function features(){return heading('MODULE DIRECTORY','Everything the island can do.','Eight independently tracked feature areas, each with its own work history.')+moduleCards()+`<section class="panel"><div class="panel-head"><h2>Module register</h2></div>${table(data.issues.filter(x=>!query||x.title.toLowerCase().includes(query.toLowerCase())||x.module.toLowerCase().includes(query.toLowerCase())))}</section>`}
function research(){return heading('DESIGN INTELLIGENCE','Research & decisions.','Keep verified platform guidance separate from inspiration and assumptions.')+`<div class="layout-2"><div class="panel"><div class="panel-head"><div><h2>Source library</h2><p>Official first-party references</p></div></div>${references.map(r=>`<div class="resource"><span class="resource-icon">↗</span><div><strong><a href="${esc(r.url)}" target="_blank" rel="noopener">${esc(r.title)}</a></strong><p>${esc(r.desc)}</p></div></div>`).join('')}</div><div class="stack"><section class="panel"><div class="panel-head"><h2>Research protocol & reusable notes</h2></div><div class="detail-card" style="padding-top:0"><textarea class="field tall" id="researchNotes" style="width:100%;min-height:255px;border:1px solid #e1e5ec;border-radius:10px;padding:12px;font-size:12px;line-height:1.8">${esc(data.notes)}</textarea><button class="button primary" id="saveResearch">Save notes</button></div></section><section class="panel"><div class="panel-head"><h2>Prompt template</h2></div><div class="detail-card" style="padding-top:0"><div class="prompt-box" id="promptText">Inspect the current macOS implementation and its source of truth. Reproduce [ISSUE], compare current and intended UI behavior, consult official Apple HIG / developer API documentation, state unsupported assumptions, propose the smallest maintainable fix, implement it, and validate with screenshots, keyboard/accessibility checks, and a concise evidence-backed change log.</div><div style="margin-top:12px"><button class="button" id="copyPrompt">Copy prompt</button></div></div></section></div></div>`}
function testing(){return heading('QUALITY ASSURANCE','Test with intention.','Every change needs reproducible evidence, not just a visual guess.')+`<div class="layout-2"><section class="panel"><div class="panel-head"><div><h2>Verification matrix</h2><p>Open an issue to document its specific test cases.</p></div></div>${table(data.issues)}</section><div class="panel"><div class="panel-head"><h2>Recommended testing dimensions</h2></div>${[['Layout & resizing','Small / large displays, native scaling, geometry bounds'],['Input & accessibility','Keyboard navigation, VoiceOver, focus order'],['State & permissions','Denied / approved, offline, empty and failure states'],['Performance & transitions','Reduced motion, memory usage, animation stability'],['Evidence','Before/after captures with build and OS version']].map(([a,b])=>`<div class="roadmap-step"><span class="step-num">✓</span><div><strong>${a}</strong><p>${b}</p></div></div>`).join('')}</div></div>`}
function release(){let n=data.checks.filter(x=>x.done).length;return heading('SHIP CHECKLIST','Release readiness.','One auditable checklist for technical quality and supervisor review.')+`<div class="layout-2"><section class="panel"><div class="panel-head"><div><h2>Release gates</h2><p>${n} of ${data.checks.length} verified · marks are manually maintained</p></div></div>${data.checks.map((x,i)=>`<label class="check-row"><input type="checkbox" data-check="${i}" ${x.done?'checked':''}><span>${esc(x.name)}</span><small>${x.done?'Verified':'Pending'}</small></label>`).join('')}<div style="padding:18px"><button class="button" id="addCheck">＋ Add criterion</button></div></section><div><section class="panel"><div class="panel-head"><h2>Readiness summary</h2></div><div class="detail-card" style="padding-top:0"><div style="font-size:36px;font-weight:760">${Math.round(n/data.checks.length*100)}%</div><div class="progress-track"><div class="progress-fill" style="width:${Math.round(n/data.checks.length*100)}%"></div></div><p>This measures checklist completion, not whether the macOS app is production-ready. Confirm builds and releases using the actual repository.</p><div class="note">A public GitHub Pages site is visible to anyone with the URL. Keep private source, secrets, personal information and unreleased sensitive screenshots out of the published project.</div></div></section><section class="panel"><div class="panel-head"><h2>Data portability</h2></div><div class="detail-card" style="padding-top:0"><p>Export your tracker as JSON and commit it to the website repository when you want to share updates. Local edits are not synchronized across browsers.</p><div class="actions-line"><button class="button" id="exportSecondary">↥ Export JSON</button><button class="button" id="importBtn">↧ Import JSON</button></div></div></section></div></div>`}
function issueDetail(){const x=data.issues.find(y=>y.id===selectedId);if(!x){selectedId=null;return overview()}return `<div class="detail-back"><button class="small-link" id="backBtn">← Back to ${page}</button></div><div class="heading-row"><div><div class="eyebrow">${esc(x.id)} · ${esc(x.module)}</div><h1 style="max-width:760px">${esc(x.title)}</h1><p class="subtitle">${esc(x.type)} · Current assumptions and acceptance criteria</p></div></div><div class="detail-layout"><div class="stack"><section class="panel detail-card"><h2>Issue definition</h2><div class="field"><label for="issueTitle">Title</label><input id="issueTitle" value="${esc(x.title)}"></div><div class="field"><label>Observed behavior / context</label><textarea id="issueSummary">${esc(x.summary)}</textarea></div><div class="field"><label>Target behavior / acceptance criteria</label><textarea id="issueTarget">${esc(x.target)}</textarea></div></section><section class="panel detail-card"><h2>Screenshot comparison</h2><p>Attach the observed state and a target mockup / reference. Attachments are stored in this browser's local storage and may be limited by size.</p><div class="screenshot-grid">${[['current','Current behavior'],['targetImage','Target behavior']].map(([field,label])=>`<div><div class="shot">${x[field]?`<img src="${esc(x[field])}" alt="${label} screenshot">`:`<span style="font-size:26px">▧</span><b>${label}</b><span>No image attached</span>`}</div><div class="shot-actions"><label class="button" style="font-size:10px">Upload image <input type="file" data-image="${field}" accept="image/*" style="display:none"></label>${x[field]?`<button class="small-link" data-remove-image="${field}">Remove</button>`:''}</div></div>`).join('')}</div></section><section class="panel detail-card"><h2>Engineering record</h2><div class="field"><label>Open questions (one per line)</label><textarea id="issueQuestions">${esc(x.questions)}</textarea></div><div class="field"><label>Decisions & reasoning</label><textarea id="issueDecisions">${esc(x.decisions)}</textarea></div><div class="split"><div class="field"><label>Implementation tasks (one per line)</label><textarea class="tall" id="issueTasks">${esc(x.tasks)}</textarea></div><div class="field"><label>Testing criteria (one per line)</label><textarea class="tall" id="issueTests">${esc(x.tests)}</textarea></div></div><div class="field"><label>Research notes / evidence / links</label><textarea id="issueNotes">${esc(x.notes)}</textarea></div><button class="button primary" id="saveIssue">Save issue changes</button></section></div><div class="stack"><section class="panel detail-card"><h2>Properties</h2><div class="field"><label>Status</label><select id="issueStatus">${['Planned','Research','In progress','Review','Blocked','Done'].map(s=>`<option ${x.status===s?'selected':''}>${s}</option>`).join('')}</select></div><div class="field"><label>Priority</label><select id="issuePriority">${['High','Medium','Low'].map(s=>`<option ${x.priority===s?'selected':''}>${s}</option>`).join('')}</select></div><div class="field"><label>Module</label><select id="issueModule">${modules.map(([s])=>`<option ${x.module===s?'selected':''}>${s}</option>`).join('')}</select></div><div class="field"><label>Classification</label><select id="issueType">${['UI issue','Feature module','Research','Technical task'].map(s=>`<option ${x.type===s?'selected':''}>${s}</option>`).join('')}</select></div><button class="button" style="color:#b75953" id="deleteIssue">Delete issue</button></section><section class="panel detail-card"><h2>Implementation prompt</h2><p>Generate a reusable, issue-specific engineering prompt for your AI coding workflow.</p><button class="button" id="copyIssuePrompt">Copy engineering prompt</button></section><section class="panel detail-card"><h2>Evidence standard</h2><div class="note">Before marking Done, verify the relevant source changes, attach before/after evidence, and record successful tests. This workspace does not independently verify implementation.</div></section></div></div>`}
function milestoneView(){
 const items=(publicHistory.milestones||[]).filter(m=>(milestoneFilter==='All'||m.kind===milestoneFilter)&&(!milestoneQuery||[m.title,m.summary,m.kind,m.status].join(' ').toLowerCase().includes(milestoneQuery.toLowerCase())));
 const total=(publicHistory.milestones||[]).length;
 return heading('EVIDENCE-BASED PROJECT JOURNEY','Development milestones.','A curated record of decisions, implementation, regressions and verified acceptance evidence.')+
 `<div class="panel" style="padding:18px 21px;margin-bottom:18px"><div style="display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:space-between"><div><b>${total} approved milestones</b><p style="margin:5px 0;color:#858b95;font-size:12px">${publicHistory.generatedAt?'Snapshot updated '+esc(new Date(publicHistory.generatedAt).toLocaleDateString()):'No approved public snapshot published yet'} · Linked evidence does not imply physical acceptance</p></div><input id="milestoneSearch" aria-label="Search milestones" placeholder="Search milestones…" value="${esc(milestoneQuery)}" style="max-width:220px;padding:9px 11px;border:1px solid #d7dce6;border-radius:9px"></div><div style="display:flex;flex-wrap:wrap;gap:7px;margin-top:14px">${['All','Feature','Fix','Research','Architecture','Testing','Release','Decision'].map(x=>`<button data-milestone-filter="${x}" class="button" style="background:${milestoneFilter===x?'#dceafb':'#f5f6f8'};font-size:11px">${x}</button>`).join('')}</div></div>`+
 (items.length?`<div class="panel" style="padding:20px">${items.map(m=>`<article style="padding:17px 0;border-bottom:1px solid #e4e7ed"><div style="display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap"><small style="color:#66758c">${esc(m.date||'Date unverified')} · ${esc(m.kind)}</small>${pill(m.status||'Review')}</div><h2 style="margin:9px 0 6px;font-size:16px">${esc(m.title)}</h2><p style="font-size:12px;line-height:1.65;color:#616d7d">${esc(m.summary||'')}</p>${m.evidence&&m.evidence.length?`<div style="display:flex;flex-wrap:wrap;gap:12px;margin-top:10px">${m.evidence.map(e=>`<a target="_blank" rel="noopener noreferrer" href="${esc(e.url)}" style="font-size:11px">${esc(e.label||'Evidence')} ↗</a>`).join('')}</div>`:''}${m.caveat?`<div class="note" style="margin-top:12px">${esc(m.caveat)}</div>`:''}</article>`).join('')}</div>`:`<div class="panel" style="padding:30px"><h2>No published milestones in this view</h2><p style="font-size:13px;line-height:1.7">This public timeline is intentionally empty until milestones have been reviewed and approved for publication. Use the local history collector to gather your entire private Git history, then selectively publish approved descriptions and references. GitHub Pages never receives your token or private source.</p></div>`);
}
async function loadPublicHistory(){try{const r=await fetch('./data/milestones.json',{cache:'no-store'});if(!r.ok)throw Error(r.status);const d=await r.json();if(d.schemaVersion===1&&Array.isArray(d.milestones)){publicHistory=d;if(page==='Milestones'&&!selectedId)render()}}catch(e){console.warn('Public milestone snapshot unavailable',e)}}
function render(){nav();$('#view').innerHTML=selectedId?issueDetail():page==='Overview'?overview():page==='UI Issues'||page==='Implementation'?listPage(page):page==='Feature Modules'?features():page==='Research'?research():page==='Milestones'?milestoneView():page==='Testing'?testing():release();bind()}
function navigate(dest){page=dest;selectedId=null;filter='All';moduleFilter='';render();window.scrollTo(0,0);$('#sidebar').classList.remove('open')}
function bind(){document.querySelectorAll('[data-nav]').forEach(el=>el.onclick=()=>navigate(el.dataset.nav));document.querySelectorAll('[data-milestone-filter]').forEach(el=>el.onclick=()=>{milestoneFilter=el.dataset.milestoneFilter;render()});if($('#milestoneSearch'))$('#milestoneSearch').oninput=e=>{milestoneQuery=e.target.value;render();const x=$('#milestoneSearch');x.focus();x.setSelectionRange(x.value.length,x.value.length)};document.querySelectorAll('[data-issue]').forEach(el=>el.onclick=()=>{selectedId=el.dataset.issue;render();window.scrollTo(0,0)});document.querySelectorAll('[data-module]').forEach(el=>el.onclick=()=>{moduleFilter=el.dataset.module;page='Implementation';filter='All';selectedId=null;render();window.scrollTo(0,0)});document.querySelectorAll('[data-filter]').forEach(el=>el.onclick=()=>{filter=el.dataset.filter;render()});document.querySelectorAll('[data-clear-module]').forEach(el=>el.onclick=()=>{moduleFilter='';render()});if($('#backBtn'))$('#backBtn').onclick=()=>{selectedId=null;render()};if($('#saveIssue'))$('#saveIssue').onclick=()=>{const x=data.issues.find(y=>y.id===selectedId);for(const [k,id] of Object.entries({title:'issueTitle',summary:'issueSummary',target:'issueTarget',questions:'issueQuestions',decisions:'issueDecisions',tasks:'issueTasks',tests:'issueTests',notes:'issueNotes',status:'issueStatus',priority:'issuePriority',module:'issueModule',type:'issueType'}))x[k]=$('#'+id).value;save();render();showToast('Issue saved locally')};if($('#deleteIssue'))$('#deleteIssue').onclick=()=>{if(confirm('Delete this issue?')){data.issues=data.issues.filter(y=>y.id!==selectedId);selectedId=null;save();render();showToast('Issue deleted')}};document.querySelectorAll('[data-image]').forEach(el=>el.onchange=async e=>{const f=e.target.files?.[0];if(!f)return;if(f.size>1.5e6){alert('Image exceeds 1.5 MB; please compress it first.');return}const r=new FileReader();r.onload=()=>{const x=data.issues.find(y=>y.id===selectedId);x[el.dataset.image]=r.result;save();render();showToast('Screenshot attached locally')};r.readAsDataURL(f)});document.querySelectorAll('[data-remove-image]').forEach(el=>el.onclick=()=>{data.issues.find(y=>y.id===selectedId)[el.dataset.removeImage]='';save();render()});if($('#saveResearch'))$('#saveResearch').onclick=()=>{data.notes=$('#researchNotes').value;save();showToast('Notes saved locally')};if($('#copyPrompt'))$('#copyPrompt').onclick=()=>copy($('#promptText').textContent);if($('#copyIssuePrompt'))$('#copyIssuePrompt').onclick=()=>{const x=data.issues.find(y=>y.id===selectedId);copy(`You are implementing an issue in a macOS Dynamic Island-style app. Respect the repository source of truth and Apple HIG / official documentation.\n\nIssue: ${x.id} — ${x.title}\nModule: ${x.module}\nObserved: ${x.summary}\nDesired: ${x.target}\nOpen questions: ${x.questions}\nExisting decisions: ${x.decisions}\nImplementation tasks:\n${x.tasks}\nAcceptance tests:\n${x.tests}\n\nFirst verify assumptions from source and documentation. Propose a minimal plan, implement only justified changes, test and produce screenshot evidence. Do not claim unverified API behavior.`)};document.querySelectorAll('[data-check]').forEach(el=>el.onchange=()=>{data.checks[+el.dataset.check].done=el.checked;save();render()});if($('#addCheck'))$('#addCheck').onclick=()=>{const name=prompt('New release criterion');if(name?.trim()){data.checks.push({name:name.trim(),done:false});save();render()}};if($('#importBtn'))$('#importBtn').onclick=()=>$('#importInput').click();if($('#exportSecondary'))$('#exportSecondary').onclick=exportData}
function copy(s){navigator.clipboard?.writeText(s).then(()=>showToast('Copied to clipboard')).catch(()=>{prompt('Copy this text',s)})}function exportData(){const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='island-studio-workspace.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);showToast('Workspace exported')}
$('#exportBtn').onclick=exportData;$('#menuBtn').onclick=()=>$('#sidebar').classList.toggle('open');$('#newBtn').onclick=()=>{const id='ISL-'+String(Math.max(0,...data.issues.map(x=>Number(x.id.split('-')[1])||0))+1).padStart(3,'0');data.issues.push({id,title:'New issue',module:'File Tray',type:'Technical task',priority:'Medium',status:'Planned',summary:'',target:'',questions:'',decisions:'',tasks:'',tests:'',notes:'',current:'',targetImage:''});selectedId=id;save();render();window.scrollTo(0,0)};$('#search').oninput=e=>{query=e.target.value;selectedId=null;if(query&&page!=='Implementation'&&page!=='UI Issues'&&page!=='Feature Modules')page='Implementation';render()};$('#importInput').onchange=async e=>{const f=e.target.files?.[0];if(!f)return;try{const d=JSON.parse(await f.text());if(!Array.isArray(d.issues)||!Array.isArray(d.checks))throw Error('Invalid schema');if(confirm('Replace local workspace with imported data?')){data=d;save();navigate('Overview');showToast('Workspace imported')}}catch{alert('This file is not a valid workspace export.')}e.target.value=''};save();render();loadPublicHistory();
</script></body></html>
