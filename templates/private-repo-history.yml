# OPTIONAL: copy this workflow into .github/workflows/history-inventory.yml
# of PRIVATE MakeItEzzz555/DynamicIsland. Also copy collect_history.py to
# scripts/collect_history.py in that private repo. Never copy raw output to public.
name: Private thesis history inventory
on:
  workflow_dispatch:
  schedule:
    - cron: '25 4 * * *' # UTC; GitHub schedules may run late or be skipped
permissions:
  contents: read
jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 scripts/collect_history.py --repo-dir . --output .private/history-inventory.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/upload-artifact@v4
        with:
          name: PRIVATE-history-inventory
          path: .private/history-inventory.json
          retention-days: 14
